<h1>OIDC Test</h1>

@if (!loggedIn) {
  <p>Not logged in.</p>
  <button (click)="login()">Login</button>
} @else {
  <p>Logged in as: <b>{{ username }}</b></p>
  <p>Roles: {{ roles.join(', ') }}</p>

  <button (click)="callBackend()">Call BE /api/users/me</button>
  <p>{{ backendAnswer }}</p>

  <button (click)="logout()">Logout</button>
}
